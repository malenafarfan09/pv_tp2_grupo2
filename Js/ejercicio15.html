<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio.15 - Meses del Año</title>
</head>
<body>

    <h1>Verificador de Meses</h1>

    <script>
        const retornarMes = (num) => {
            const m = [
                "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
                "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
            ];

            if (num >= 1 && num <= 12) {
                return m[num - 1];
            } else {
                return "No es un mes válido";
            }
        };

        const ip = () => {
            const numIng = parseInt(prompt("Ingrese un número del 1 al 12:"));
            
            const resultado = retornarMes(numIn);

            document.write(`<p>Resultado: <strong>${resultado}</strong></p>`);
        };

        ip();
    </script>

</body>
</html>
